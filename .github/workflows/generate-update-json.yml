name: Generate update.json

# Runs whenever you publish a GitHub Release (not draft, not pre-release edits)
on:
  release:
    types: [published]

permissions:
  contents: write   # needed to commit update.json back into the repo

jobs:
  generate-update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main   # the branch your raw.githubusercontent.com URL points to

      - name: Download signed installer + signature from this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          mkdir -p assets
          gh release download "$TAG" \
            -p "*x64_en-US.msi" \
            -p "*x64_en-US.msi.sig" \
            -D assets \
            -R "${{ github.repository }}"

      - name: Build update.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          VERSION="${TAG#v}"   # strips a leading "v" if you tag as v0.1.4

          INSTALLER_FILE=$(ls assets/*x64_en-US.msi)
          SIG_FILE=$(ls assets/*x64_en-US.msi.sig)
          INSTALLER_NAME=$(basename "$INSTALLER_FILE")
          SIGNATURE=$(cat "$SIG_FILE")
          URL="https://github.com/${REPO}/releases/download/${TAG}/${INSTALLER_NAME}"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$RELEASE_BODY" \
            --arg pub_date "$PUBLISHED_AT" \
            --arg sig "$SIGNATURE" \
            --arg url "$URL" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  signature: $sig,
                  url: $url
                }
              }
            }' > update.json

          cat update.json   # printed to the Actions log so you can sanity-check it

      - name: Commit update.json to the repo
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add update.json

          if git diff --cached --quiet; then
            echo "update.json is already up to date, nothing to commit."
          else
            git commit -m "Update update.json for release ${TAG}"
            git push origin HEAD:main
          fi
