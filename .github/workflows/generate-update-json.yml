name: Generate update.json

# Runs whenever you publish a GitHub Release (not draft, not pre-release edits)
on:
  release:
    types: [published]

permissions:
  contents: write   # needed to upload update.json back onto the release

jobs:
  generate-update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed installer + signature from this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          mkdir -p assets
          # Adjust the -p pattern if you ship .msi instead of .exe
          gh release download "$TAG" \
            -p "*x64-setup.exe" \
            -p "*x64-setup.exe.sig" \
            -D assets \
            -R "${{ github.repository }}"

      - name: Build update.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          VERSION="${TAG#v}"   # strips a leading "v" if you tag as v0.1.4

          EXE_FILE=$(ls assets/*x64-setup.exe)
          SIG_FILE=$(ls assets/*x64-setup.exe.sig)
          EXE_NAME=$(basename "$EXE_FILE")
          SIGNATURE=$(cat "$SIG_FILE")
          URL="https://github.com/${REPO}/releases/download/${TAG}/${EXE_NAME}"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$RELEASE_BODY" \
            --arg pub_date "$PUBLISHED_AT" \
            --arg sig "$SIGNATURE" \
            --arg url "$URL" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  signature: $sig,
                  url: $url
                }
              }
            }' > update.json

          cat update.json   # printed to the Actions log so you can sanity-check it

      - name: Upload update.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" update.json --clobber -R "${{ github.repository }}"
